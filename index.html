<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="logo.png">
<meta property="og:title" content="陽獅集團萬聖節活動">
<meta property="og:description" content="誠摯邀請您參加">
<meta property="og:image" content="logologo.png">
<meta property="og:type" content="website">
<title>陽獅集團萬聖節活動</title>
<style>

.event-page-wrapper *{ box-sizing: border-box; margin:0; padding:0; }

.event-page-wrapper{
  font-family: "Noto Sans TC", "PingFang TC", "Microsoft YaHei", sans-serif;
  background-color: #000000 !important;
  color: #ffffff !important;
}

.event-page-wrapper img{ display:block; max-width:100%; }
.event-page-wrapper section{ position: relative; width: 100%; }

/* 1. 頂端 LOGO 區 */
.event-page-wrapper .section-logo{
  background-color: #000000 !important;
  height: 120px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.event-page-wrapper .section-logo img{
  height: 70%;
  width: auto;
  object-fit: contain;
}
@media (max-width: 768px){
  .event-page-wrapper .section-logo{ height: 80px; }
}

/* 2. 滿版活動主視覺區（靜態圖片，依裝置切換） */
.event-page-wrapper .section-hero{
  background-color: #000000 !important;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow: hidden;
}
.event-page-wrapper .hero-media-wrap{
  width: 100%;
  position: relative;
  overflow: hidden;
}
.event-page-wrapper .hero-media{
  display: block;
  width: 100%;
  height: auto;
  object-fit: contain;
}
.event-page-wrapper .hero-media-desktop{
  display: block;
  aspect-ratio: 2384 / 1684;
}
.event-page-wrapper .hero-media-mobile{
  display: none;
}
.event-page-wrapper .hero-cta-wrap{
  padding: 40px 0 56px;
  background-color: #000000 !important;
  width: 100%;
  display: flex;
  justify-content: center;
}
.event-page-wrapper .btn-cta{
  background-color: rgba(180,76,35,1) !important;
  color: rgba(255,255,255,1) !important;
  border: none;
  padding: 16px 48px;
  border-radius: 999px;
  font-size: 15px;
  letter-spacing: 3px;
  text-transform: uppercase;
  cursor: pointer;
  transition: transform .3s ease, box-shadow .3s ease;
  text-decoration: none;
  display: inline-block;
}
.event-page-wrapper .btn-cta:hover{
  transform: translateY(-2px);
  box-shadow: 0 12px 28px rgba(130,132,0,.4);
}
@media (max-width: 768px){
.event-page-wrapper .hero-media-desktop{ display: none !important; }
.event-page-wrapper .hero-media-mobile{
  display: block !important;
  aspect-ratio: 1024 / 1536;
}
.event-page-wrapper .btn-cta{ padding: 18px 46px; font-size: 16px; letter-spacing: 2px; }
.event-page-wrapper .hero-cta-wrap{ margin-bottom: 28px; }
}

/* 3 & 4. 主題卡片輪播區 */
.event-page-wrapper .section-theme{
background-color: #000000 !important;
padding: 130px 5% 110px;
position: relative;
}
.event-page-wrapper .section-theme::after{
content: '';
position: absolute;
top: 130px;
right: 0;
bottom: 134px;
width: 80px;
background: linear-gradient(to right, transparent, #000000);
pointer-events: none;
}
@media (max-width: 768px){
.event-page-wrapper .section-theme::after{
display: none;
}
}
.event-page-wrapper .theme-title{
  text-align: center;
  font-size: 2.4rem;
  letter-spacing: 6px;
  margin-bottom: 56px;
  font-weight: 500;
  color: #ffffff !important;
}
.event-page-wrapper .card-carousel{
  display: flex;
  gap: 24px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  padding-bottom: 24px;
  -webkit-overflow-scrolling: touch;
}
.event-page-wrapper .card-carousel::-webkit-scrollbar{ height: 6px; }
.event-page-wrapper .card-carousel::-webkit-scrollbar-thumb{
  background-color: rgba(255,255,255,.3);
  border-radius: 3px;
}
.event-page-wrapper .card{
  flex: 0 0 260px;
  scroll-snap-align: start;
  border-radius: 28px;
  overflow: hidden;
  position: relative;
  aspect-ratio: 3 / 4;
  display: flex;
  flex-direction: column;
}
.event-page-wrapper .card img{
  width: 100%;
  height: 62%;
  object-fit: cover;
}
.event-page-wrapper .card .card-text{
  flex: 1;
  padding: 18px 20px;
  font-size: 1.25rem;
  line-height: 1.5;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}
.event-page-wrapper .theme1 .card{ background-color: rgba(72,37,114,1) !important; }
.event-page-wrapper .theme1 .card .card-text{ color: rgba(255,255,255,1) !important; }
.event-page-wrapper .theme2 .card{ background-color: rgba(205,87,31,1) !important; }
.event-page-wrapper .theme2 .card .card-text{ color: rgba(255,255,255,1) !important; }

/* 第4區卡片：第2、3行文字縮小，各自獨立成一行 */
.event-page-wrapper .theme2 .card-sub{
  display: block;
  width: 100%;
  margin-top: 6px;
}
.event-page-wrapper .theme2 .card-sub-line{
  display: block;
  width: 100%;
  font-size: 1rem;
  line-height: 1.4;
  opacity: 0.9;
}

@media (max-width: 768px){
.event-page-wrapper .section-theme{ padding: 70px 5% 60px; }
.event-page-wrapper .theme-title{ font-size: 1.6rem; letter-spacing: 3px; margin-bottom: 36px; }
.event-page-wrapper .card{ flex: 0 0 269px; }
.event-page-wrapper .card .card-text{ font-size: 1.15rem; }
.event-page-wrapper .theme2 .card-sub-line{ font-size: 0.9rem; }
}

/* 5. 背景圖 A 滾動說故事區 */
.event-page-wrapper .section-story{
  position: relative;
  height: 220vh;
  background-color: #000000 !important;
}
.event-page-wrapper .story-sticky{
  position: sticky;
  top: 0;
  height: 100vh;
  width: 100%;
  overflow: hidden;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}
.event-page-wrapper .story-text-wrap{
  position: absolute;
  right: 6%;
  top: 25%;
  transform: translateY(-50%);
  width: 65%;
  max-width: 680px;
}
.event-page-wrapper .story-text-img{
  position: absolute !important;
  top: 0 !important; left: 0 !important;
  width: 100% !important;
  opacity: 0 !important;
  transform: translateY(40px) !important;
  transition: opacity .7s ease, transform .7s ease !important;
}
.event-page-wrapper .story-text-img.is-active{
  opacity: 1 !important;
  transform: translateY(0) !important;
}
.event-page-wrapper .story-text-img.is-exit{
  opacity: 0 !important;
  transform: translateY(-60px) !important;
}
@media (max-width: 768px){
.event-page-wrapper .section-story{ height: auto; }
.event-page-wrapper .story-sticky{
position: relative;
height: auto;
min-height: 100vh;
background-size: 333% auto;
background-position: 30% center;
padding: 80px 0;
}
.event-page-wrapper .story-text-wrap{
position: static;
transform: none;
width: 94%;
margin: 0 auto 24px;
background-color: rgba(0, 0, 0, 0.55);
border-radius: 16px;
padding: 24px 20px;
text-align: center;
}
.event-page-wrapper .story-text-img{
position: static !important;
opacity: 1 !important;
transform: none !important;
margin-bottom: 24px;
}
.event-page-wrapper .story-text-img:last-child{
margin-bottom: 0;
}
}

/* 6. Registration Form 區（自訂表單 → Power Automate → SharePoint List） */
.event-page-wrapper .section-form{
  background-color: #0d0d0d !important;
  padding: 100px 5%;
}
.event-page-wrapper .form-title{
  text-align: center;
  font-size: 1.8rem;
  letter-spacing: 4px;
  margin-bottom: 44px;
  color: #ffffff !important;
}
.event-page-wrapper .form-card{
  max-width: 480px;
  margin: 0 auto;
  background-color: rgba(255,255,255,.04);
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 24px;
  padding: 44px 36px;
  backdrop-filter: blur(6px);
}
.event-page-wrapper .form-group{ margin-bottom: 22px; }
.event-page-wrapper .form-group label{
  display: block;
  font-size: 0.85rem;
  letter-spacing: 1.5px;
  margin-bottom: 8px;
  color: rgba(255,255,255,.8) !important;
}
.event-page-wrapper .form-group input{
  width: 100%;
  padding: 13px 16px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,.25);
  background-color: rgba(255,255,255,.05);
  color: #ffffff !important;
  font-size: 1rem;
  font-family: inherit;
}
.event-page-wrapper .form-group input::placeholder{ color: rgba(255,255,255,.35); }
.event-page-wrapper .form-group input:focus{
  outline: none;
  border-color: rgba(255,255,255,.6);
}
.event-page-wrapper .btn-submit{
  width: 100%;
  padding: 15px;
  border-radius: 999px;
  border: none;
  background-color: rgba(180,76,35,1) !important;
  color: #ffffff !important;
  font-size: 15px;
  letter-spacing: 3px;
  cursor: pointer;
  margin-top: 10px;
  font-family: inherit;
  transition: transform .3s ease, opacity .3s ease;
}
.event-page-wrapper .btn-submit:hover{ transform: translateY(-2px); }
.event-page-wrapper .btn-submit:disabled{ opacity: .6; cursor: wait; transform: none; }
.event-page-wrapper .form-message{
  display: none;
  padding: 14px 18px;
  border-radius: 10px;
  margin-bottom: 20px;
  text-align: center;
  font-size: 0.95rem;
}
.event-page-wrapper .form-message.is-success{
  display: block;
  background-color: rgba(76,175,80,.15);
  border: 1px solid rgba(76,175,80,.5);
  color: #8ee89a !important;
}
.event-page-wrapper .form-message.is-error{
  display: block;
  background-color: rgba(220,53,69,.15);
  border: 1px solid rgba(220,53,69,.5);
  color: #ff8a93 !important;
}

@media (max-width: 768px){
.event-page-wrapper .form-card{ padding: 28px 20px; }
.event-page-wrapper .form-title{ font-size: 1.28rem; letter-spacing: 2px; margin-bottom: 36px; }
.event-page-wrapper .form-group input{ font-size: 16px; }
}

html, body{
  background-color: #000000 !important;
}

</style>
</head>
<body>

<div class="event-page-wrapper">

  <!-- 1. 頂端 LOGO 區 -->
  <section class="section-logo">
    <img src="logologo.png" alt="集團 Logo" />
  </section>

  <!-- 2. 滿版活動主視覺區（靜態圖片，依裝置切換） -->
  <section class="section-hero">
    <div class="hero-media-wrap">
      <img class="hero-media hero-media-desktop" src="2-pc.jpg" alt="活動主視覺（桌機版）" />
      <img class="hero-media hero-media-mobile" src="2-mb.png" alt="活動主視覺（手機版）" />
    </div>
    <div class="hero-cta-wrap">
      <button type="button" id="scrollToRegistrationBtn" class="btn-cta">立即報名</button>
    </div>
  </section>

  <!-- 3. 主題一：《獅紀：百變》卡片輪播 -->
  <section class="section-theme theme1">
    <h2 class="theme-title">《獅紀：百變》</h2>
    <div class="card-carousel">
      <div class="card">
        <img src="3-1-food.jpg" alt="百變活動一" loading="lazy" />
        <div class="card-text">美食饗宴<br>1~2F 太陽廳</div>
      </div>
      <div class="card">
        <img src="3-2-360.jpg" alt="百變活動二" loading="lazy" />
        <div class="card-text">360度拍照體驗<br>5F</div>
      </div>
      <div class="card">
        <img src="3-3-g.jpg" alt="百變活動三" loading="lazy" />
        <div class="card-text">試膽體驗<br>5F 後台</div>
      </div>
      <div class="card">
        <img src="3-4-ft.jpg" alt="百變活動四" loading="lazy" />
        <div class="card-text">現場占卜<br>5F 包廂</div>
      </div>
      <div class="card">
        <img src="3-5-paint.jpg" alt="百變活動五" loading="lazy" />
        <div class="card-text">變裝似顏繪<br>5F 包廂</div>
      </div>
    </div>
  </section>

  <!-- 4. 主題二：《獅紀：無界》卡片輪播 -->
  <section class="section-theme theme2">
    <h2 class="theme-title">《獅紀：無界》</h2>
    <div class="card-carousel">
      <div class="card">
        <img src="4-1-p.png" alt="無界活動一" loading="lazy" />
        <div class="card-text">識人 無界<span class="card-sub"><span class="card-sub-line">Beyond Persona</span><span class="card-sub-line">越過既定印象與標籤</span></span></div>
      </div>
      <div class="card">
        <img src="4-2-i.png" alt="無界活動二" loading="lazy" />
        <div class="card-text">實現 無界<span class="card-sub"><span class="card-sub-line">Beyond Imagination</span><span class="card-sub-line">讓創意，不再受限於製作條件</span></span></div>
      </div>
      <div class="card">
        <img src="4-3-v.png" alt="無界活動三" loading="lazy" />
        <div class="card-text">共感 無界<span class="card-sub"><span class="card-sub-line">Beyond Variations</span><span class="card-sub-line">內容不再只有一個固定版本</span></span></div>
      </div>
      <div class="card">
        <img src="4-4-p.png" alt="無界活動四" loading="lazy" />
        <div class="card-text">協作 無界<span class="card-sub"><span class="card-sub-line">Beyond Process</span><span class="card-sub-line">工作，也可以被重新設計</span></span></div>
      </div>
      <div class="card">
        <img src="4-5-t.png" alt="無界活動五" loading="lazy" />
        <div class="card-text">專業 無界<span class="card-sub"><span class="card-sub-line">Beyond Expertise</span><span class="card-sub-line">專業可以被延伸、被整合</span></span></div>
      </div>
    </div>
  </section>

  <!-- 5. 背景圖 A 滾動說故事區 -->
  <section class="section-story">
    <div class="story-sticky" style="background-image: url('%E8%83%8C%E6%99%AFA.png');">
      <div class="story-text-wrap">
        <img id="storyText1" class="story-text-img is-active" src="%E5%9C%B0%E5%9D%80%E6%99%82%E9%96%93-%E6%96%87%E5%AD%97.png" alt="活動地址時間" />
        <img id="storyText2" class="story-text-img" src="%E6%B4%BB%E5%8B%95%E6%B5%81%E7%A8%8B-%E6%96%87%E5%AD%97.png" alt="活動流程" />
      </div>
    </div>
  </section>

  <!-- 6. Registration Form 區：自訂表單 → Power Automate → SharePoint List -->
  <section id="registration" class="section-form">
    <h2 class="form-title">立即報名</h2>
    <div class="form-card">
      <div id="formMessage" class="form-message"></div>
      <form id="registrationForm" novalidate>
        <input type="text" name="website" id="honeypot" style="position:absolute; left:-9999px; top:-9999px;" tabindex="-1" autocomplete="off">
        <div class="form-group">
          <label for="cnName">中文姓名</label>
          <input type="text" id="cnName" name="cnName" placeholder="請輸入中文姓名" autocomplete="name" required />
        </div>
        <div class="form-group">
          <label for="enName">英文姓名</label>
          <input type="text" id="enName" name="enName" placeholder="請輸入英文姓名" autocomplete="name" required />
        </div>
        <div class="form-group">
          <label for="company">公司名稱</label>
          <input type="text" id="company" name="company" placeholder="請輸入公司名稱" autocomplete="organization" required />
        </div>
        <div class="form-group">
          <label for="title">職稱</label>
          <input type="text" id="title" name="title" placeholder="請輸入職稱" autocomplete="organization-title" required />
        </div>
        <div class="form-group">
          <label for="email">信箱</label>
          <input type="email" id="email" name="email" placeholder="請輸入 Email" autocomplete="email" required />
        </div>
        <button type="submit" class="btn-submit">確認報名</button>
      </form>
    </div>
  </section>

</div>

<script>
document.addEventListener('DOMContentLoaded', function(){

  // ============================================
  // 第 5 區：背景圖滾動說故事效果
  // ============================================
  var section = document.querySelector('.section-story');
  var text1 = document.getElementById('storyText1');
  var text2 = document.getElementById('storyText2');

  function showText(el){
    el.style.setProperty('opacity', '1', 'important');
    el.style.setProperty('transform', 'translateY(0px)', 'important');
  }
  function hideTextUp(el){
    el.style.setProperty('opacity', '0', 'important');
    el.style.setProperty('transform', 'translateY(-60px)', 'important');
  }
  function hideTextDown(el){
    el.style.setProperty('opacity', '0', 'important');
    el.style.setProperty('transform', 'translateY(40px)', 'important');
  }

  function updateStoryText(){
    if(!section || !text1 || !text2) return;
    var rect = section.getBoundingClientRect();
    var scrolled = -rect.top;
    var scrollable = section.offsetHeight - window.innerHeight;
    var progress = scrollable > 0 ? scrolled / scrollable : 0;
    progress = Math.max(0, Math.min(1, progress));

    if(progress < 0.5){
      showText(text1);
      hideTextDown(text2);
    } else {
      hideTextUp(text1);
      showText(text2);
    }
  }

  if(text1) text1.style.setProperty('transition', 'opacity .7s ease, transform .7s ease', 'important');
  if(text2) text2.style.setProperty('transition', 'opacity .7s ease, transform .7s ease', 'important');

  if(window.innerWidth > 768){
    window.addEventListener('scroll', updateStoryText, { passive: true });
    window.addEventListener('resize', updateStoryText);
    updateStoryText();
  } else {
    [text1, text2].forEach(function(el){
      if(el){
        el.style.removeProperty('opacity');
        el.style.removeProperty('transform');
      }
    });
  }

  // ============================================
  // 第 2 區：CTA 按鈕，點擊後平滑捲動到報名表單區
  // ============================================
  var ctaBtn = document.getElementById('scrollToRegistrationBtn');
  if(ctaBtn){
    ctaBtn.addEventListener('click', function(){
      var target = document.getElementById('registration');
      if(target){
        target.scrollIntoView({ behavior: 'smooth' });
      }
    });
  }

  // ============================================
  // 第 6 區：報名表單送出 → Power Automate → SharePoint List
  // ============================================
  var FLOW_URL = "https://defaultd52c9ea17c2147b182a333a74b1f74.b8.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/9e1c1881ac414019be441114075e412f/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=IJY2fHMksIy_Ze84NjeJhlYKvE0kYt5dMaT9GixIozM";

  var form = document.getElementById('registrationForm');
  var msgBox = document.getElementById('formMessage');

  function showMsg(text, ok){
    msgBox.textContent = text;
    msgBox.className = 'form-message ' + (ok ? 'is-success' : 'is-error');
  }

  if(form){
    form.addEventListener('submit', function(e){
      e.preventDefault();

      // 防機器人：隱藏欄位有值就不送出
      var honeypot = document.getElementById('honeypot');
      if(honeypot && honeypot.value !== '') return;

      var data = {
        cnName: document.getElementById('cnName').value.trim(),
        enName: document.getElementById('enName').value.trim(),
        company: document.getElementById('company').value.trim(),
        title: document.getElementById('title').value.trim(),
        email: document.getElementById('email').value.trim()
      };

      if(!data.cnName || !data.enName || !data.company || !data.title || !data.email){
        showMsg('⚠️ 請完整填寫所有欄位。', false);
        return;
      }
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)){
        showMsg('⚠️ 信箱格式不正確，請再確認。', false);
        return;
      }

      var btn = form.querySelector('.btn-submit');
      btn.disabled = true;
      btn.textContent = '送出中...';

      fetch(FLOW_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      .then(function(res){
        if(res.ok){
          showMsg('✅ 報名成功，感謝您的參與！', true);
          form.reset();
        } else {
          console.error('送出失敗，狀態碼：', res.status);
          showMsg('⚠️ 報名失敗，請稍後再試一次。', false);
        }
      })
      .catch(function(err){
        console.error('發生錯誤：', err);
        showMsg('⚠️ 網路連線異常，請稍後再試一次。', false);
      })
      .finally(function(){
        btn.disabled = false;
        btn.textContent = '確認報名';
      });
    });
  }

});
</script>

</body>
</html>
